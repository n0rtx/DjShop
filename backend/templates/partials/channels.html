<address>
    <ul>
        {% for channel in channels %}
        <li data-type="{{ channel.type }}">
            <span>{{ channel.label }}:</span>
            {% if channel.href %}<a href="{{ channel.href }}">{{ channel.value }}</a>{% else %}{{ channel.value }}{% endif %}
        </li>
        {% endfor %}
    </ul>
</address>
<h2>Opening Hours</h2>
<dl>
    {% for row in hours %}
    <dt>{{ row.days }}</dt>
    <dd>{{ row.time }}</dd>
    {% endfor %}
</dl>
<p><a href="{{ map.url }}" target="_blank" rel="noopener">Open map</a></p>
