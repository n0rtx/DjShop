{% extends "base.html" %}

{% block content %}
<section data-section="category" data-slug="{{ data.category.slug }}">
    <h1>{{ data.category.title }}</h1>
    <p>{{ data.category.description }}</p>
    <p>{{ data.category.count }} products · Brands: {{ data.brands|join:", " }}</p>
    {% include "partials/product_list.html" with products=data.products %}
</section>
{% endblock %}
