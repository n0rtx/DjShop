{% extends "base.html" %}

{% block content %}
<section data-section="catalog">
    <h1>{{ data.title }}</h1>
    <p>{{ data.subtitle }}</p>
    <ul>
        {% for category in data.categories %}
        <li><a href="{{ category.url }}"><img src="{{ category.image }}" alt="" width="160" height="120" loading="lazy"> {{ category.title }} ({{ category.count }})</a></li>
        {% endfor %}
    </ul>
    <h2>All products</h2>
    {% include "partials/product_list.html" with products=data.products %}
</section>
{% endblock %}
