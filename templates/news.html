{% extends "base.html" %}

{% block content %}
<section data-section="news">
    <img src="{{ data.icon }}" alt="" width="48" height="48">
    <h1>{{ data.title }}</h1>
    <p>{{ data.subtitle }}</p>
    {% for item in data.items %}
    <article data-id="{{ item.id }}" data-slug="{{ item.slug }}">
        <img src="{{ item.icon }}" alt="" width="40" height="40">
        <span>{{ item.tag }}</span>
        <time datetime="{{ item.date }}">{{ item.date }}</time>
        <h2>{{ item.title }}</h2>
        <p>{{ item.excerpt }}</p>
    </article>
    {% endfor %}
</section>
{% endblock %}
