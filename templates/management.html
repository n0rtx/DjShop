{% extends "base.html" %}

{% block content %}
<section data-section="management">
    <img src="{{ data.icon }}" alt="" width="48" height="48">
    <h1>{{ data.title }}</h1>
    <p>{{ data.subtitle }}</p>
    <ul>
        {% for member in data.members %}
        <li data-id="{{ member.id }}">
            <img src="{{ member.icon }}" alt="" width="64" height="64">
            <h2>{{ member.name }}</h2>
            <p><strong>{{ member.alias }}</strong></p>
            <p>{{ member.position }}</p>
            <p>{{ member.bio }}</p>
        </li>
        {% endfor %}
    </ul>
</section>
{% endblock %}
